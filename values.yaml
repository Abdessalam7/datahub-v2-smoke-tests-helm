global:
  registry: docker.artifactory-dogen.group.echonet
  imagePullSecret: image-pull-secret
  # Same namespace as datahub-v2-web-ui-helm, so this workload and the web UI
  # it feeds via COS live side by side.
  namespace: monitoring-datahub-v2

smokeTests:
  name: datahub-v2-smoke-tests
  image:
    repository: private.fr2.icr.io/a101731-hprd/datahub-v2-smoke-tests
    tag: "main"
    pullPolicy: Always

  # Shared by both CronJobs (Airflow and Spark checks run as separate Jobs).
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid

  # cos-credentials is the same Secret datahub-v2-web-ui-helm's backend reads.
  # Its actual keys (COS_ENDPOINT_URL, ...) don't all match what
  # scripts/config.py expects (COS_ENDPOINT, ...) — this mapping bridges that.
  cosSecret:
    secretName: cos-credentials
    keys:
      COS_ENDPOINT: COS_ENDPOINT_URL
      COS_BUCKET_NAME: COS_BUCKET_NAME
      COS_REGION: COS_REGION
      COS_ACCESS_KEY_ID: COS_ACCESS_KEY_ID
      COS_SECRET_ACCESS_KEY: COS_SECRET_ACCESS_KEY

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

  serviceAccount:
    create: true
    name: "datahub-v2-smoke-tests"
    annotations: {}

  securityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  # Maps 1:1 to scripts/config.py's env vars (SERVICE is set per-CronJob in
  # its template, not here). TARGET/ENV_LIST pick the environment split
  # (e.g. TARGET=hprd ENV_LIST=dev,int,qual, or TARGET=prod ENV_LIST=prod,pprd).
  airflow:
    env:
      TARGET: "hprd"
      ENV_LIST: "dev,int,qual"
      HTTP_TIMEOUT: "10"
      INSTANCES_CONFIG_PATH: "/etc/datahub-v2-smoke-tests/instances.json"
      LOCAL_OUTPUT_PATH: "/tmp/status.json"

  spark:
    env:
      TARGET: "hprd"
      ENV_LIST: "dev,int,qual"
      HTTP_TIMEOUT: "10"
      LOCAL_OUTPUT_PATH: "/tmp/status.json"
      # Leave blank and set vaultClientCert.enabled below once the Vault
      # cert-auth role for this workload's identity is set up.
      VAULT_NS: ""
      VAULT_URL: ""

    # Vault mTLS client cert for the Spark check (see spark_auth.py). Off by
    # default: flip on once a Certificate/Secret has been provisioned for
    # this workload's own identity (see this chart's README).
    vaultClientCert:
      enabled: false
      secretName: ""
      mountPath: /client-cert

  # ============================================================================
  # Airflow instances to check (same shape as the airflowctl_inst_list_json
  # Airflow Variable, as a native YAML list instead of a JSON string).
  # ============================================================================
  instances:
    - apcode: a101731
      customer:
        apcode: a101731
        name: aidi
        snow_label: a3i
      env: dev
      release_id: 53d53716
      url: https://astronomer-a101731-dev-53d53716.data.cloud.net.intra
      version: 3.5.3
      zone: hprd
    - apcode: ap50708
      customer:
        apcode: ap50708
        name: arval
        snow_label: arval
      env: dev
      release_id: 70af7d64
      url: https://astronomer-ap50708-dev-70af7d64.data.cloud.net.intra
      version: 3.5.3
      zone: hprd
