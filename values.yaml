image:
  repository: private.fr2.icr.io/a101731-hprd/datahub-v2-smoke-tests
  tag: "main"
  pullPolicy: Always

command: ["python", "-u", "scripts/main.py"]

# Both CronJobs (Airflow, Spark) share this schedule.
schedule: "*/10 * * * *"
concurrencyPolicy: Forbid

imagePullSecrets:
  - name: image-pull-secret

podAnnotations: {}

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: "datahub-v2-smoke-tests"
  # Identity cert-manager issues a client certificate for — this is what Spark's
  # Vault cert-auth (see spark_auth.py) will authenticate as, once wired up.
  annotations:
    cert-manager.io/issuer: datalab-cloud-echonet-issuer
    cert-manager.io/issuer-group: horizon.evertrust.io
    cert-manager.io/issuer-kind: ClusterIssuer

# Pulls the registry image-pull secret from Vault via external-secrets, instead
# of assuming `image-pull-secret` (see imagePullSecrets above) already exists
# in the namespace. Off by default — not yet validated against a real
# SecretStore/Vault KV path for this workload.
vault:
  enabled: false
  refreshInterval: "1h"
  secretStoreName: "vault-store"
  secretStoreKind: "SecretStore"
  kv:
    path: "secret/registry/icr"
imagePullSecretName: "datahub-v2-smoke-tests-secret"

# ============================================================================
# Airflow CronJob
# ============================================================================
airflow:
  env:
    - name: ENV
      value: "dev"
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: TARGET
      value: "hprd"
    - name: ENV_LIST
      value: "dev,int,qual"
    - name: SERVICE
      value: "airflow"
    - name: HTTP_TIMEOUT
      value: "10"
    - name: INSTANCES_CONFIG_PATH
      value: "/etc/datahub-v2-smoke-tests/instances.json"
    - name: LOCAL_OUTPUT_PATH
      value: "/tmp/status.json"
    - name: COS_OBJECT_KEY
      value: "monitoring-web/input/airflow/status.json"
    # Credentials injected from the existing `cos-credentials` Secret.
    - name: COS_ENDPOINT
      valueFrom:
        secretKeyRef: { name: cos-credentials, key: COS_ENDPOINT }
    - name: COS_BUCKET_NAME
      valueFrom:
        secretKeyRef: { name: cos-credentials, key: COS_BUCKET_NAME }
    - name: COS_REGION
      valueFrom:
        secretKeyRef: { name: cos-credentials, key: COS_REGION }
    - name: COS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef: { name: cos-credentials, key: COS_ACCESS_KEY_ID }
    - name: COS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef: { name: cos-credentials, key: COS_SECRET_ACCESS_KEY }
  volumeMounts:
    - name: instances-config
      mountPath: /etc/datahub-v2-smoke-tests
      readOnly: true
  # ⚠️ configMap.name below can't reference the chart's fullname helper (values.yaml
  # isn't templated) — it must match `<release-name>-<chart-name>-instances` for
  # whatever release name you actually deploy under. Update it if you install
  # under a different release name than `datahub-v2-smoke-tests`.
  volumes:
    - name: instances-config
      configMap:
        name: datahub-v2-smoke-tests-datahub-v2-smoke-tests-instances
        items:
          - key: instances.json
            path: instances.json
  resources: {}

# ============================================================================
# Spark CronJob — VAULT_NS/VAULT_URL and the client-cert volume are left empty
# until the Vault cert-auth role for this workload's identity is set up (see
# README). Until then this CronJob will run but fail to authenticate.
# ============================================================================
spark:
  env:
    - name: ENV
      value: "dev"
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: TARGET
      value: "hprd"
    - name: ENV_LIST
      value: "dev,int,qual"
    - name: SERVICE
      value: "spark"
    - name: HTTP_TIMEOUT
      value: "10"
    - name: LOCAL_OUTPUT_PATH
      value: "/tmp/status.json"
    - name: COS_OBJECT_KEY
      value: "monitoring-web/input/spark/status.json"
    - name: VAULT_NS
      value: ""
    - name: VAULT_URL
      value: ""
    - name: COS_ENDPOINT
      valueFrom:
        secretKeyRef: { name: cos-credentials, key: COS_ENDPOINT }
    - name: COS_BUCKET_NAME
      valueFrom:
        secretKeyRef: { name: cos-credentials, key: COS_BUCKET_NAME }
    - name: COS_REGION
      valueFrom:
        secretKeyRef: { name: cos-credentials, key: COS_REGION }
    - name: COS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef: { name: cos-credentials, key: COS_ACCESS_KEY_ID }
    - name: COS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef: { name: cos-credentials, key: COS_SECRET_ACCESS_KEY }
  volumeMounts: []
  volumes: []
  resources: {}

# ============================================================================
