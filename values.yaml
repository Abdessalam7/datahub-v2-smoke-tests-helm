image:
  repository: private.fr2.icr.io/a101731-hprd/pysmoke-test
  tag: main
  pullPolicy: Always

command: ["python", "-u", "scripts/main.py"]

schedule: "*/10 * * * *"
concurrencyPolicy: Forbid

imagePullSecrets:
  - name: image-pull-secret

podAnnotations: {}

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: "pysmoke"
  annotations:
    cert-manager.io/issuer: datalab-cloud-echonet-issuer
    cert-manager.io/issuer-group: horizon.evertrust.io
    cert-manager.io/issuer-kind: ClusterIssuer

airflow:
  env:
    - name: ENV
      value: "dev"
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: TARGET
      value: "hprd"
    - name: ENV_LIST
      value: "dev,int,qual"
    - name: SERVICE
      value: "airflow"
    - name: HTTP_TIMEOUT
      value: "10"
    - name: INSTANCES_CONFIG_PATH
      value: "/etc/pysmoke-test/instances.json"
    - name: LOCAL_OUTPUT_PATH
      value: "/tmp/status.json"
    - name: COS_OBJECT_KEY
      value: "monitoring-web/input/airflow/status.json"
    - name: COS_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: cos-credentials
          key: COS_ENDPOINT
    - name: COS_BUCKET_NAME
      valueFrom:
        secretKeyRef:
          name: cos-credentials
          key: COS_BUCKET_NAME
    - name: COS_REGION
      valueFrom:
        secretKeyRef:
          name: cos-credentials
          key: COS_REGION
    - name: COS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: cos-credentials
          key: COS_ACCESS_KEY_ID
    - name: COS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: cos-credentials
          key: COS_SECRET_ACCESS_KEY
  volumeMounts:
    - name: instances-config
      mountPath: /etc/pysmoke-test
      readOnly: true
  volumes:
    - name: instances-config
      configMap:
        name: pysmoke-test-pysmoke-instances
        items:
          - key: instances.json
            path: instances.json
  resources: {}

spark:
  env:
    - name: ENV
      value: "dev"
    - name: PYTHONUNBUFFERED
      value: "1"
    # The Spark control-plane and auth endpoints are single shared hosts under
    # "prod" naming regardless of which environments are being checked — ENV_LIST
    # below (not TARGET) is what filters returned tenants by environment.
    - name: TARGET
      value: "prod"
    # Spark tenants use their own env naming (pprod/prod), distinct from
    # Airflow's dev/int/qual — confirmed via the tenant-count diagnostic log
    # in spark_check.py (0 KO/0 total was this filter matching nothing).
    - name: ENV_LIST
      value: "pprod,prod"
    - name: SERVICE
      value: "spark"
    - name: HTTP_TIMEOUT
      value: "10"
    - name: LOCAL_OUTPUT_PATH
      value: "/tmp/status.json"
    - name: COS_OBJECT_KEY
      value: "monitoring-web/input/spark/status.json"
    - name: VAULT_NS
      value: "a101731"
    - name: VAULT_URL
      value: "https://vault.staging.echonet.net.intra"
    - name: COS_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: cos-credentials
          key: COS_ENDPOINT
    - name: COS_BUCKET_NAME
      valueFrom:
        secretKeyRef:
          name: cos-credentials
          key: COS_BUCKET_NAME
    - name: COS_REGION
      valueFrom:
        secretKeyRef:
          name: cos-credentials
          key: COS_REGION
    - name: COS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: cos-credentials
          key: COS_ACCESS_KEY_ID
    - name: COS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: cos-credentials
          key: COS_SECRET_ACCESS_KEY
  volumeMounts:
    - name: vault-client-cert
      mountPath: /client-cert
      readOnly: true
  volumes:
    - name: vault-client-cert
      secret:
        secretName: pysmoke-test-spark-vault-cert
  resources: {}
  # Bootstrap only — the datalab-cloud-echonet-issuer (EverTrust Horizon) has
  # been confirmed to issue server-auth-only certs (no "client auth" EKU) no
  # matter what usages are requested here, so cert-manager can't be trusted
  # to own this secret ongoing: it'll periodically overwrite a good cert with
  # one Vault's cert-auth rejects. Leave this false; see README for the
  # manual one-time seed procedure via Vault's own PKI engine instead.
  vaultClientCert:
    enabled: false
    secretName: pysmoke-test-spark-vault-cert
    commonName: pysmoke-test-spark.data.cloud.net.intra
    issuerName: datalab-cloud-echonet-issuer
    issuerKind: ClusterIssuer
    issuerGroup: horizon.evertrust.io
  # Auto-renews spark.vaultClientCert.secretName using the cert itself
  # (cert-auth) to fetch its own replacement from Vault's PKI engine — no
  # Kubernetes-auth dependency. This is the only thing that should manage
  # the secret once it's seeded (see README) — keep vaultClientCert.enabled
  # false so cert-manager doesn't fight it for the same secret.
  vaultCertRenewal:
    enabled: true
    vaultServer: "https://vault.staging.echonet.net.intra"
    vaultNamespace: "a101731"
    pkiPath: "pkis/pysmoke-test"
    pkiRole: "pysmoke-spark"
    refreshInterval: "24h"

# Monitors every DAG (not just health) on each Airflow instance, flagging ones
# stuck "queued" past dags.env.QUEUED_THRESHOLD_SECONDS. Off by default — needs
# a technical user provisioned on each client's Airflow first (see README).
dags:
  enabled: true
  env:
    - name: ENV
      value: "dev"
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: ENV_LIST
      value: "dev,int,qual"
    # Each client's Airflow is its own instance with its own user base — scope
    # this to whichever clients actually have the technical user provisioned
    # (comma-separated business_line names, e.g. "pf"). Empty = every client,
    # which will 403 for any client not yet set up.
    - name: CLIENT_LIST
      value: ""
    - name: SERVICE
      value: "dags"
    - name: HTTP_TIMEOUT
      value: "10"
    - name: QUEUED_THRESHOLD_SECONDS
      value: "600"
    # Sends an email only when a run finds a problem (failed or delayed DAG);
    # requires the smtp-credentials secret below and EMAIL_TO to be set,
    # otherwise the run just logs a warning and skips the send.
    - name: EMAIL_ENABLED
      value: "true"
    # Sourced from the Vault smtp secret (host/port/user/password/sender) —
    # double-check these key names against whatever the real Secret's keys
    # are, same caveat as cos-credentials above.
    - name: SMTP_HOST
      valueFrom:
        secretKeyRef:
          name: smtp-credentials
          key: host
    - name: SMTP_PORT
      valueFrom:
        secretKeyRef:
          name: smtp-credentials
          key: port
    - name: SMTP_USERNAME
      valueFrom:
        secretKeyRef:
          name: smtp-credentials
          key: user
    - name: SMTP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: smtp-credentials
          key: password
    - name: SMTP_USE_TLS
      value: "true"
    - name: EMAIL_FROM
      valueFrom:
        secretKeyRef:
          name: smtp-credentials
          key: sender
    # Comma-separated recipients — not sensitive, kept as a plain value.
    - name: EMAIL_TO
      value: ""
    - name: INSTANCES_CONFIG_PATH
      value: "/etc/pysmoke-test/instances.json"
    - name: LOCAL_OUTPUT_PATH
      value: "/tmp/status.json"
    - name: COS_OBJECT_KEY
      value: "monitoring-web/input/dags/status.json"
    - name: AIRFLOW_DAG_USERNAME
      valueFrom:
        secretKeyRef:
          name: airflow-dag-monitor
          key: username
    - name: AIRFLOW_DAG_PASSWORD
      valueFrom:
        secretKeyRef:
          name: airflow-dag-monitor
          key: password
    - name: COS_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: cos-credentials
          key: COS_ENDPOINT
    - name: COS_BUCKET_NAME
      valueFrom:
        secretKeyRef:
          name: cos-credentials
          key: COS_BUCKET_NAME
    - name: COS_REGION
      valueFrom:
        secretKeyRef:
          name: cos-credentials
          key: COS_REGION
    - name: COS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: cos-credentials
          key: COS_ACCESS_KEY_ID
    - name: COS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: cos-credentials
          key: COS_SECRET_ACCESS_KEY
  volumeMounts:
    - name: instances-config
      mountPath: /etc/pysmoke-test
      readOnly: true
  volumes:
    - name: instances-config
      configMap:
        name: pysmoke-test-pysmoke-instances
        items:
          - key: instances.json
            path: instances.json
  resources: {}

