apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.smokeTests.name }}-spark
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.smokeTests.name }}-spark
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: smoke-tests-spark
spec:
  schedule: {{ .Values.smokeTests.schedule | quote }}
  concurrencyPolicy: {{ .Values.smokeTests.concurrencyPolicy }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: {{ .Values.smokeTests.name }}-spark
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ .Values.smokeTests.serviceAccount.name }}
          imagePullSecrets:
            - name: {{ .Values.global.imagePullSecret }}

          {{- if .Values.smokeTests.securityContext.enabled }}
          securityContext:
            runAsNonRoot: {{ .Values.smokeTests.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.smokeTests.securityContext.runAsUser }}
            runAsGroup: {{ .Values.smokeTests.securityContext.runAsGroup }}
            fsGroup: {{ .Values.smokeTests.securityContext.fsGroup }}
          {{- end }}

          containers:
            - name: smoke-tests-spark
              image: "{{ .Values.smokeTests.image.repository }}:{{ .Values.smokeTests.image.tag }}"
              imagePullPolicy: {{ .Values.smokeTests.image.pullPolicy }}
              workingDir: /app
              command: ["python", "-u", "scripts/main.py"]

              env:
                - name: SERVICE
                  value: "spark"
                {{- range $key, $value := .Values.smokeTests.spark.env }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
                {{- end }}
                - name: COS_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.smokeTests.cosSecret.secretName }}
                      key: {{ .Values.smokeTests.cosSecret.keys.COS_ENDPOINT }}
                - name: COS_BUCKET_NAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.smokeTests.cosSecret.secretName }}
                      key: {{ .Values.smokeTests.cosSecret.keys.COS_BUCKET_NAME }}
                - name: COS_REGION
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.smokeTests.cosSecret.secretName }}
                      key: {{ .Values.smokeTests.cosSecret.keys.COS_REGION }}
                - name: COS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.smokeTests.cosSecret.secretName }}
                      key: {{ .Values.smokeTests.cosSecret.keys.COS_ACCESS_KEY_ID }}
                - name: COS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.smokeTests.cosSecret.secretName }}
                      key: {{ .Values.smokeTests.cosSecret.keys.COS_SECRET_ACCESS_KEY }}

              {{- if .Values.smokeTests.spark.vaultClientCert.enabled }}
              volumeMounts:
                - name: vault-client-cert
                  mountPath: {{ .Values.smokeTests.spark.vaultClientCert.mountPath }}
                  readOnly: true
              {{- end }}

              resources:
                {{- toYaml .Values.smokeTests.resources | nindent 16 }}

          {{- if .Values.smokeTests.spark.vaultClientCert.enabled }}
          volumes:
            - name: vault-client-cert
              secret:
                secretName: {{ .Values.smokeTests.spark.vaultClientCert.secretName }}
          {{- end }}
