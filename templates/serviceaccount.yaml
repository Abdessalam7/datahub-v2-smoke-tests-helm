apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.smokeTests.serviceAccount.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.smokeTests.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.smokeTests.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
